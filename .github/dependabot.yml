version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # v1.2.x removed the bundled dist/index.js entrypoint, breaking the
      # pinned-commit usage of this action. Stay on v1.1.26 until upstream
      # ships a working release. See:
      # https://github.com/taskmedia/action-conventional-commits
      - dependency-name: taskmedia/action-conventional-commits
        versions: [">= 1.2.0"]

  - package-ecosystem: pip
    directories:
      - /
      - /doc
      - /example
      - /test
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
